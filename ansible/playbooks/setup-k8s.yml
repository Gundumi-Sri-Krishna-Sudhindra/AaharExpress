---
- name: Setup Kubernetes master node
  hosts: k8s-master
  become: yes

  vars:
    kube_packages:
      - kubelet
      - kubeadm
      - kubectl

  tasks:
    - name: Install required apt packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes signing key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name: "{{ kube_packages }}"
        state: present
        update_cache: yes

    - name: Hold kube packages at current version
      shell: |
        for pkg in {{ kube_packages | join(' ') }}; do
          apt-mark hold $pkg || true
        done
      changed_when: false

    - name: Disable swap (required by Kubernetes)
      command: swapoff -a
      when: ansible_swaptotal_mb | default(0) > 0

    - name: Comment out any swap entries in fstab
      replace:
        path: /etc/fstab
        regexp: '^(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Enable bridge netfilter
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        state: present
        sysctl_set: yes
        reload: yes

    - name: Enable bridge netfilter for IPv6
      sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        state: present
        sysctl_set: yes
        reload: yes

    - name: Initialize Kubernetes cluster
      command: kubeadm init --pod-network-cidr=192.168.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init
      changed_when: "'Your Kubernetes control-plane has initialized' in kubeadm_init.stdout"

    - name: Wait for kubelet to start
      wait_for:
        path: /etc/kubernetes/manifests
        state: directory
      timeout: 60

    - name: Create .kube directory for regular user
      file:
        path: "/home/{{ ansible_user_id }}/.kube"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid | default(ansible_user_id) }}"
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user_id }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_gid | default(ansible_user_id) }}"
        mode: '0600'

    - name: Wait for Kubernetes API server to be ready
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        for i in {1..60}; do
          if kubectl --kubeconfig="$KUBECONFIG" get nodes &>/dev/null; then
            echo "API server is ready"
            exit 0
          fi
          sleep 2
        done
        echo "API server did not become ready in time"
        exit 1
      register: api_ready
      changed_when: false
      failed_when: "'API server is ready' not in api_ready.stdout"

    - name: Wait for control plane pods to be ready
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        for i in {1..30}; do
          READY=$(kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system -l tier=control-plane --no-headers 2>/dev/null | grep -c "Running" || echo "0")
          TOTAL=$(kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system -l tier=control-plane --no-headers 2>/dev/null | wc -l || echo "0")
          if [ "$READY" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
            echo "All control plane pods are ready"
            exit 0
          fi
          sleep 2
        done
        echo "Control plane pods did not become ready in time"
        exit 1
      register: control_plane_ready
      changed_when: false
      failed_when: "'All control plane pods are ready' not in control_plane_ready.stdout"

    - name: Install Calico network plugin
      command: >
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
      environment:
        KUBECONFIG: "/home/{{ ansible_user_id }}/.kube/config"

    - name: Wait for Calico pods to be ready
      shell: |
        export KUBECONFIG="/home/{{ ansible_user_id }}/.kube/config"
        for i in {1..60}; do
          READY=$(kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system -l k8s-app=calico-node --no-headers 2>/dev/null | grep -c "Running" || echo "0")
          if [ "$READY" -gt 0 ]; then
            echo "Calico is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Calico did not become ready in time"
        exit 1
      register: calico_ready
      changed_when: false
      failed_when: "'Calico is ready' not in calico_ready.stdout"
      environment:
        KUBECONFIG: "/home/{{ ansible_user_id }}/.kube/config"


