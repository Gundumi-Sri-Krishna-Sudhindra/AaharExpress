name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./AaharExpress_F
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./AaharExpress_B
          file: ./AaharExpress_B/DockerFile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:latest

      - name: SSH to server and deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~
            if [ -d "AaharExpress" ]; then
              cd AaharExpress
              git pull
            else
              git clone https://github.com/Gundumi-Sri-Krishna-Sudhindra/AaharExpress.git
              cd AaharExpress
            fi
            export KUBECONFIG=/home/ubuntu/.kube/config
            sudo mkdir -p /opt/k8s
            sudo cp ansible/files/k8s-manifests/*.yaml /opt/k8s/
            sudo chown -R ubuntu:ubuntu /opt/k8s
            kubectl apply -f /opt/k8s/


