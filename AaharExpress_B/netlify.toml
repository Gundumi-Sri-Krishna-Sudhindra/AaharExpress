[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://aahar-express-f.vercel.app"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "X-Requested-With, Content-Type, Accept, Authorization"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age = "86400"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/cors-preflight"
  status = 200
  force = true
  conditions = { Method = ["OPTIONS"] }

[[redirects]]
  from = "/api/auth/signin"
  to = "/.netlify/functions/auth-signin"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200
  force = true

# Other API routes should call the Spring Boot host directly from the frontend
# or use additional functions/redirects as needed.