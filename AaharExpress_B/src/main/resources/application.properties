spring.application.name=AaharExpress_B

# MySQL Database Configuration (env override-ready)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aahar_express?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization - Using JPA to create tables from entities
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# App Properties
jwt.secret=${JWT_SECRET:AaharExpressSecretKey123456789012345678901234567890}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Server port
server.port=${SERVER_PORT:8080}

# CORS / Frontend configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5175,http://localhost:5173,http://localhost:8888,https://aahar-express-f.vercel.app}
spring.mvc.cors.allowed-origins=${app.cors.allowed-origins}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:aaharexpressindia@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zfue kwoa pngp rigr}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true